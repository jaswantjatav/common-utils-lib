name: Build and Publish npm Package to JFrog

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Compile TypeScript to Production Modules
        run: npm run build

      - name: Configure JFrog Authentication Token
        run: |
          # Configure both fallback routes to ensure npm matches authentication during publishing
          echo "registry=https://${{ secrets.JFROG_URL }}/artifactory/api/npm/npm-virtual/" > ~/.npmrc
          echo "//${{ secrets.JFROG_URL }}/artifactory/api/npm/npm-virtual/:_authToken=${{ secrets.JFROG_NPM_AUTH_TOKEN }}" >> ~/.npmrc
          echo "always-auth=true" >> ~/.npmrc

      - name: Publish Package
        run: npm publish